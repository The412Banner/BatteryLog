name: Build BatteryLog APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-app.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Sign with testkey (force v1 + v2 + v3)
        run: |
          mkdir -p out
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -1)
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/debug/app-debug.apk out/aligned.apk
          # --min-sdk-version 21 forces apksigner to embed all three blocks;
          # without it, minSdk 29 makes it emit v3 only (v1/v2 deemed unnecessary).
          "$BT/apksigner" sign \
            --key app/testkey.pk8 --cert app/testkey.x509.pem \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out out/BatteryLog-debug.apk out/aligned.apk
          rm -f out/aligned.apk out/BatteryLog-debug.apk.idsig
          sha256sum out/BatteryLog-debug.apk | tee out/BatteryLog-debug.apk.sha256

      - name: Verify signature (testkey, v1/v2/v3)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort | tail -1)
          # Verify across the same SDK range the signing used, otherwise apksigner
          # only reports v3 (v1/v2 are irrelevant above API 27 and shown false).
          "$BT/apksigner" verify --min-sdk-version 21 --verbose --print-certs out/BatteryLog-debug.apk | tee out/signature.txt
          grep -q "v1 scheme (JAR signing): true" out/signature.txt
          grep -q "v2 scheme (APK Signature Scheme v2): true" out/signature.txt
          grep -q "v3 scheme (APK Signature Scheme v3): true" out/signature.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryLog-debug
          path: out/*
